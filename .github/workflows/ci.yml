name: CI

on:
  pull_request:
    paths-ignore: &docs
      # Not **/*.md: the site's content and the test fixtures are Markdown too.
      - 'specs/**'
      - 'README.md'
      - '.specify/**/*.md'
      - '.claude/**/*.md'
      - 'assets-src/**/*.md'
  push:
    branches: [main]
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npx astro check

      - name: Unit tests (with fixture builds)
        run: npm test

      - name: Build
        run: npm run build

      - name: SEO check
        run: npm run check:seo

      - name: Scene budget
        run: npm run check:scene

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('package-lock.json') }}

      - name: Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # The cache only holds the browsers, not the system libraries they need.
      - name: Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: External links (warnings only)
        run: npm run check:links
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
          retention-days: 7
