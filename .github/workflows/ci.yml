name: CI

# Run by hand (Actions → CI → Run workflow): the same checks as `npm run ci`, on Linux. A showcase
# site does not need them on every change, and on these runners they take over 10 minutes.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npx astro check

      - name: Unit tests (with fixture builds)
        run: npm test

      - name: Build
        run: npm run build

      - name: SEO check
        run: npm run check:seo

      - name: Scene budget
        run: npm run check:scene

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: External links (warnings only)
        run: npm run check:links
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
          retention-days: 7
